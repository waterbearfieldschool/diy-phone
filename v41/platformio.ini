[platformio]
boards_dir = boards

[env]
platform = nordicnrf52
board = promicro_nrf52840
framework = arduino
upload_protocol = nrfutil
build_flags =
    -DSERIAL_BUFFER_SIZE=2048
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    greiman/SdFat

; The phone.
[env:promicro_nrf52840]
build_src_filter = +<*> -<diag/>

; Hardware wiring checks, one setup()/loop() each: pio run -e displaytest
[env:displaytest]
build_src_filter = +<diag/display_test.cpp>

[env:simtest]
build_src_filter = +<diag/sim_test.cpp> +<Modem.cpp> +<Log.cpp>
